<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ωmy – Async Konsent-Entscheidungen</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23010920'/><text x='50' y='76' text-anchor='middle' font-size='72' fill='%23BEE600' font-family='serif'>Ω</text></svg>">
  <style>
    :root {
      --lime: #BEE600;
      --dark: #010920;
      --white: #FFFFFF;
      --gray-bg: #F6F6F6;
      --gray-border: #E2E2E2;
      --gray-text: #6B7280;
      --radius: 8px;
      --shadow: 0 2px 10px rgba(1,9,32,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--gray-bg);
      color: var(--dark);
      min-height: 100vh;
    }

    header {
      background: var(--dark);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-dot { width: 10px; height: 10px; background: var(--lime); border-radius: 50%; flex-shrink: 0; }
    header h1 { font-size: 17px; font-weight: 600; color: var(--white); letter-spacing: 0.3px; }

    main { max-width: 740px; margin: 40px auto; padding: 0 20px 60px; }

    .card { background: var(--white); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .card > p { color: var(--gray-text); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }

    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"], input[type="date"], textarea {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--gray-border); border-radius: 6px;
      font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--dark);
      margin-bottom: 20px; transition: border-color 0.2s; background: var(--white);
    }
    input:focus, textarea:focus { outline: none; border-color: var(--lime); }
    textarea { resize: vertical; min-height: 100px; }

    .btn-primary {
      background: var(--lime); color: var(--dark); border: none;
      padding: 11px 22px; border-radius: 6px;
      font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.82; }

    .btn-ghost {
      background: transparent; color: var(--gray-text);
      border: 1.5px solid var(--gray-border); padding: 10px 18px; border-radius: 6px;
      font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--dark); color: var(--dark); }

    .btn-danger {
      background: transparent; color: #B91C1C;
      border: 1.5px solid #FECACA; padding: 10px 18px; border-radius: 6px;
      font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-danger:hover { background: #FEF2F2; border-color: #DC2626; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--gray-text); cursor: pointer;
      margin-bottom: 24px; background: var(--white);
      border: 1.5px solid var(--gray-border); border-radius: 6px;
      font-family: 'Poppins', sans-serif; padding: 8px 14px;
      transition: border-color 0.2s, color 0.2s;
    }
    .back-btn:hover { color: var(--dark); border-color: var(--dark); }

    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gray-text); margin-bottom: 8px;
    }

    .proposal-box {
      background: var(--gray-bg); border-left: 3px solid var(--lime);
      padding: 16px 18px; border-radius: 4px;
      font-size: 14px; line-height: 1.7; margin-bottom: 24px; white-space: pre-wrap;
    }

    /* SETT */
    .sett-box {
      background: var(--dark); color: var(--white);
      border-radius: var(--radius); padding: 22px 26px; margin-bottom: 28px;
    }
    .sett-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--lime); margin-bottom: 8px; }
    .sett-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .sett-box p { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.6; }

    /* Resistance */
    .resistance-scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0 24px; }
    @media (max-width: 500px) { .resistance-scale { grid-template-columns: repeat(3, 1fr); } }
    .r-btn {
      padding: 14px 6px; border: 2px solid var(--gray-border); border-radius: 8px;
      background: var(--white); cursor: pointer; text-align: center;
      transition: all 0.15s; font-family: 'Poppins', sans-serif;
    }
    .r-btn:hover { border-color: #aaa; }
    .r-btn .r-num { font-size: 22px; font-weight: 700; display: block; }
    .r-btn .r-lab { font-size: 10px; color: var(--gray-text); display: block; margin-top: 3px; line-height: 1.3; }
    .r-btn[data-v="0"] .r-num { color: #16A34A; }
    .r-btn[data-v="1"] .r-num { color: #65A30D; }
    .r-btn[data-v="2"] .r-num { color: #CA8A04; }
    .r-btn[data-v="3"] .r-num { color: #EA580C; }
    .r-btn[data-v="4"] .r-num { color: #DC2626; }
    .r-btn[data-v="5"] .r-num { color: #7F1D1D; }
    .r-btn[data-v="0"].active { border-color: #16A34A; background: #F0FDF4; }
    .r-btn[data-v="1"].active { border-color: #65A30D; background: #F7FEE7; }
    .r-btn[data-v="2"].active { border-color: #CA8A04; background: #FEFCE8; }
    .r-btn[data-v="3"].active { border-color: #EA580C; background: #FFF7ED; }
    .r-btn[data-v="4"].active { border-color: #DC2626; background: #FEF2F2; }
    .r-btn[data-v="5"].active { border-color: #7F1D1D; background: #FEF2F2; }

    /* Decision list */
    .d-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border: 1.5px solid var(--gray-border); border-radius: var(--radius);
      margin-bottom: 10px; cursor: pointer; transition: border-color 0.18s; background: var(--white);
    }
    .d-item:hover { border-color: var(--dark); }
    .d-item h3 { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .d-item .d-meta { font-size: 12px; color: var(--gray-text); }

    .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; margin-left: 12px; flex-shrink: 0; }
    .badge-open        { background: #EEF2FF; color: #4338CA; }
    .badge-running     { background: #FFF7ED; color: #C2410C; }
    .badge-integration { background: #FEF9C3; color: #854D0E; }
    .badge-done        { background: #F0FDF4; color: #15803D; }
    .badge-meeting     { background: #FEF2F2; color: #B91C1C; }

    /* Votes */
    .vote-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--gray-bg); border-radius: 6px; margin-bottom: 6px; }
    .v-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 80px; }
    .v-circle { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--white); flex-shrink: 0; }
    .vc-0 { background: #16A34A; } .vc-1 { background: #65A30D; } .vc-2 { background: #CA8A04; }
    .vc-3 { background: #EA580C; } .vc-4 { background: #DC2626; } .vc-5 { background: #7F1D1D; }
    .v-comment { font-size: 13px; color: var(--gray-text); flex: 2; }

    /* Banners */
    .banner { padding: 18px 22px; border-radius: var(--radius); margin-bottom: 20px; }
    .banner h2 { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
    .banner p  { font-size: 13px; }
    .b-done    { background: #F0FDF4; border: 2px solid #16A34A; }
    .b-done h2 { color: #15803D; } .b-done p { color: #166534; }
    .b-meeting { background: #FEF2F2; border: 2px solid #DC2626; }
    .b-meeting h2 { color: #B91C1C; } .b-meeting p { color: #991B1B; }
    .b-integration { background: #FEFCE8; border: 2px solid #CA8A04; }
    .b-integration h2 { color: #854D0E; } .b-integration p { color: #713F12; }

    /* Moderator section */
    .mod-section {
      border-top: 1px solid var(--gray-border);
      margin-top: 28px; padding-top: 24px;
    }
    .mod-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--lime);
      background: var(--dark); display: inline-block;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 16px;
    }

    /* Integration form */
    .integration-form {
      background: #FEFCE8; border: 1.5px solid #FDE047;
      border-radius: var(--radius); padding: 20px 22px; margin-top: 16px;
    }
    .integration-form h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .integration-form p  { font-size: 13px; color: var(--gray-text); margin-bottom: 16px; }

    /* Round indicator */
    .round-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      background: var(--dark); color: var(--lime);
      padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
    }

    /* Round history */
    .round-history { margin-top: 8px; }
    .round-block { margin-bottom: 16px; }
    .round-block-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .round-block-header h4 { font-size: 14px; font-weight: 600; }
    .round-closed-badge { font-size: 11px; color: var(--gray-text); background: var(--gray-bg); padding: 2px 8px; border-radius: 10px; }

    /* Misc */
    .row  { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .divider { border: none; border-top: 1px solid var(--gray-border); margin: 20px 0; }
    .empty { text-align: center; padding: 52px 24px; color: var(--gray-text); }
    .empty .icon { font-size: 36px; margin-bottom: 14px; }
    .empty h3 { font-size: 16px; color: var(--dark); margin-bottom: 6px; }
    .empty p  { font-size: 13px; max-width: 320px; margin: 0 auto; }
    .hint { font-size: 12px; color: var(--gray-text); margin-top: -12px; margin-bottom: 20px; }

    /* Meta chips in list */
    .meta-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { font-size: 11px; color: var(--gray-text); background: var(--gray-bg); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
    .chip strong { color: var(--dark); font-weight: 600; }

    /* Archive toggle */
    .archive-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; cursor: pointer; border-top: 1px solid var(--gray-border); margin-top: 8px;
    }
    .archive-header span { font-size: 13px; font-weight: 500; color: var(--gray-text); }
    .list-section-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-text); margin: 4px 2px 10px; }
    .archive-header .chevron { font-size: 12px; color: var(--gray-text); transition: transform 0.2s; }
    .archive-header.open .chevron { transform: rotate(180deg); }

    /* Next steps box */
    .next-steps-box {
      background: #F0FDF4; border: 1.5px solid #BBF7D0;
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
    }
    .next-steps-box .ns-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #15803D; margin-bottom: 6px; }
    .next-steps-box p { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: var(--dark); }
    .next-steps-box a { font-size: 13px; color: #15803D; word-break: break-all; }
    .next-steps-form { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gray-border); }
    .next-steps-form h4 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .next-steps-form.ns-fresh { background: #FEFCE8; border: 1.5px solid #FDE047; border-radius: var(--radius); padding: 16px 18px; }

    /* Help panel */
    .help-panel { background: var(--white); border: 1.5px solid var(--gray-border); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
    .help-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--gray-text); user-select: none; transition: color 0.15s; }
    .help-header:hover { color: var(--dark); }
    .help-header .h-chev { margin-left: auto; font-size: 11px; transition: transform 0.2s; }
    .help-header.open .h-chev { transform: rotate(180deg); }
    .help-body { padding: 2px 18px 18px; font-size: 13px; line-height: 1.7; }
    .help-body h4 { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--gray-text); margin: 14px 0 6px; }
    .help-body ol, .help-body ul { padding-left: 18px; }
    .help-body li { margin-bottom: 3px; }
    .help-scale { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
    .help-scale span { font-size: 11px; background: var(--gray-bg); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
    .help-sett { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-border); color: var(--gray-text); }
    .dict-entry { background: var(--gray-bg); border-left: 3px solid var(--lime); padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
    .dict-hw { font-weight: 700; font-size: 15px; }
    .dict-phon { color: var(--gray-text); font-size: 12px; margin-left: 3px; }
    .dict-sub { display: block; font-size: 12px; color: var(--gray-text); margin-top: 4px; }
    .help-result-table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; }
    .help-result-table td { padding: 4px 6px; vertical-align: top; line-height: 1.5; }
    .help-result-table td:first-child { color: var(--gray-text); white-space: nowrap; padding-right: 8px; }
    .help-result-table td:nth-child(2) { color: var(--gray-text); padding: 4px 4px; }
    .sheet-error-banner { background: #FEF2F2; border: 1.5px solid #FECACA; border-radius: var(--radius); padding: 11px 16px; margin-bottom: 16px; font-size: 13px; color: #991B1B; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  </style>
</head>

<script>
// ── Constants ────────────────────────────────────────────────────
const R_LABELS = ['kein', 'gering', 'leicht erhöht', 'erhöht', 'stark', 'extrem'];
const R_TITLES = [
  'Kein Widerstand – du stimmst zu oder hast keine nennenswerten Einwände',
  'Geringer Widerstand – kleine Bedenken, aber vertretbar',
  'Leicht erhöht – merklicher Widerstand, du kannst aber damit leben',
  'Erhöht – spürbarer Widerstand; das Ergebnis hängt auch von dir ab',
  'Stark – schwerwiegender Einwand; Runde 2 oder Meeting wahrscheinlich',
  'Extrem – fundamentaler Einwand; synchrones Meeting notwendig'
];
const BADGE_TITLES = {
  open:        'Noch keine Stimmen abgegeben',
  running:     'Abstimmung läuft – Stimmen können noch abgegeben werden',
  integration: 'Runde 1 geschlossen – Vorschlag wird überarbeitet, dann folgt Runde 2',
  done:        'Alle Widerstände ≤ 3 – Entscheidung ist async gefallen',
  meeting:     'Widerstand > 3 nach Runde 2 – synchrones Meeting ist der nächste Schritt'
};

// ── State ────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/a/macros/seibert.group/s/AKfycbyNMQDcZozcZMhcBDJK1XGLr0Q3OIwOtDcChNeiAcrGfZ9Lv8yI57ShV4lJ4Z_w_Ge1/exec';

const state = {
  view: 'home',
  currentId: null,
  voterName: localStorage.getItem('konsent_voter') || '',
  decisions: [],
  loading: true,
  sheetError: false,
  filter: 'all'
};
let selectedR = null;
let archiveOpen = false;
let helpOpen = false;

function migrate(d) {
  if (d.votes && !d.rounds) {
    return { ...d, createdBy: d.createdBy || '', rounds: [{ num: 1, proposal: d.proposal, votes: d.votes, closed: false }] };
  }
  return d;
}

async function loadData() {
  state.loading = true;
  state.sheetError = false;
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    if (Array.isArray(data)) {
      // Sheet ist Quelle der Wahrheit – auch ein leeres Sheet überschreibt localStorage
      state.decisions = data.map(migrate).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      localStorage.setItem('konsent_data', JSON.stringify(state.decisions));
      state.loading = false;
      return;
    }
  } catch(e) {
    console.error('Ωmy: Sheet nicht erreichbar –', e);
    state.sheetError = true;
    // Nur bei Verbindungsfehler: localStorage als Offline-Fallback
    const raw = JSON.parse(localStorage.getItem('konsent_data') || '[]');
    state.decisions = raw.map(migrate);
  }
  state.loading = false;
}

function syncToSheets(d) {
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(d)
  }).catch(() => {});
}

function save(modifiedDecision) {
  localStorage.setItem('konsent_data', JSON.stringify(state.decisions));
  if (modifiedDecision) syncToSheets(modifiedDecision);
}
function go(view, id = null) {
  state.view = view; state.currentId = id; selectedR = null;
  if (view === 'detail' && id) history.replaceState(null, '', '?id=' + id);
  else history.replaceState(null, '', location.pathname);
  render(); window.scrollTo(0, 0);
}
function setFilter(f) { state.filter = f; render(); }
function copyLink(id) {
  const url = location.origin + location.pathname + '?id=' + id;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-link-btn');
    if (btn) { btn.textContent = '✓ Kopiert!'; setTimeout(() => { btn.textContent = '🔗 Link kopieren'; }, 2000); }
  });
}
function current() { return state.decisions.find(d => d.id === state.currentId); }
function activeRound(d) { return d.rounds[d.rounds.length - 1]; }

function hasComments(r) {
  return r.votes.some(v => v.comment && v.comment.trim());
}

function status(d) {
  const r = activeRound(d);
  if (!r.closed) {
    return r.votes.length === 0
      ? { key: 'open', label: 'Offen' }
      : { key: 'running', label: `Runde ${r.num} läuft` };
  }
  const hasBlock   = r.votes.some(v => v.value > 3);
  const needsRound2 = r.num === 1 && (hasBlock || hasComments(r));
  if (needsRound2) return { key: 'integration', label: 'In Integration' };
  if (hasBlock)    return { key: 'meeting', label: 'Meeting nötig' };
  return { key: 'done', label: 'Entschieden' };
}

function renderDecisionItem(d) {
  const s = status(d);
  const r = activeRound(d);
  return `<div class="d-item" onclick="go('detail','${d.id}')">
    <div style="flex:1;min-width:0;">
      <h3>${esc(d.title)}</h3>
      <div class="meta-chips">
        <span class="chip"><strong>Erstellt von:</strong> ${esc(d.createdBy || '–')}</span>
        <span class="chip"><strong>Erstellungsdatum:</strong> ${new Date(d.createdAt).toLocaleDateString('de-DE')}</span>
        ${d.deadline ? `<span class="chip"><strong>Deadline:</strong> ${new Date(d.deadline + 'T00:00:00').toLocaleDateString('de-DE')}</span>` : ''}
        <span class="chip"><strong>Stimmen:</strong> ${r.votes.length}</span>
        <span class="chip"><strong>Runde:</strong> ${r.num}</span>
      </div>
    </div>
    <span class="badge badge-${s.key}" title="${BADGE_TITLES[s.key]}">${s.label}</span>
  </div>`;
}

// ── Actions ──────────────────────────────────────────────────────
function createDecision() {
  const mod      = val('f-mod');
  const title    = val('f-title');
  const tension  = val('f-tension');
  const proposal = val('f-proposal');
  const deadline = val('f-deadline');

  if (!mod || !title || !tension || !proposal) {
    alert('Bitte alle Pflichtfelder (*) ausfüllen.');
    return;
  }

  const d = {
    id: Date.now().toString(),
    title, tension, deadline,
    createdBy: mod,
    rounds: [{ num: 1, proposal, votes: [], closed: false }],
    createdAt: new Date().toISOString()
  };
  state.decisions.unshift(d);
  save(d);
  go('detail', d.id);
}

function pickR(v) {
  selectedR = v;
  document.querySelectorAll('.r-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === v));
}

function submitVote(id) {
  const name    = val('v-name');
  const comment = val('v-comment');
  if (!name)              { alert('Bitte deinen Namen eingeben.'); return; }
  if (selectedR === null) { alert('Bitte einen Widerstandswert wählen.'); return; }

  state.voterName = name;
  localStorage.setItem('konsent_voter', name);

  const d = state.decisions.find(d => d.id === id);
  const r = activeRound(d);
  r.votes = r.votes.filter(v => v.voter.toLowerCase() !== name.toLowerCase());
  r.votes.push({ voter: name, value: selectedR, comment });
  save(d);
  go('detail', id);
}

function closeRound(id) {
  const d = state.decisions.find(d => d.id === id);
  const r = activeRound(d);
  if (r.votes.length === 0 && !confirm('Noch keine Stimmen vorhanden. Trotzdem schließen?')) return;

  // Runde 2: check if all R1 voters have voted
  if (r.num === 2 && d.rounds.length >= 2) {
    const r1voters = d.rounds[0].votes.map(v => v.voter);
    const r2voters = r.votes.map(v => v.voter);
    const missing  = r1voters.filter(n => !r2voters.some(m => m.toLowerCase() === n.toLowerCase()));
    if (missing.length > 0) {
      const names = missing.join(', ');
      if (!confirm(`${missing.length} Person${missing.length > 1 ? 'en' : ''} aus Runde 1 ${missing.length > 1 ? 'haben' : 'hat'} noch nicht abgestimmt: ${names}.\n\nTrotzdem schließen?`)) return;
    }
  }

  r.closed = true;
  save(d);
  render();
  const newStatus = status(d).key;
  if (newStatus === 'done' || newStatus === 'meeting') {
    setTimeout(() => {
      const el = document.getElementById('ns-text');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); }
    }, 80);
  }
}

function reopenRound(id) {
  const d = state.decisions.find(d => d.id === id);
  activeRound(d).closed = false;
  save(d);
  render();
}

function startRound2(id) {
  const proposal = val('r2-proposal');
  if (!proposal) { alert('Bitte einen überarbeiteten Vorschlag eingeben.'); return; }
  const d = state.decisions.find(d => d.id === id);
  d.rounds.push({ num: 2, proposal, votes: [], closed: false });
  save(d);
  go('detail', id);
}

function saveNextSteps(id) {
  const d = state.decisions.find(d => d.id === id);
  d.nextSteps   = val('ns-text');
  d.responsible = val('ns-responsible');
  d.docsLink    = val('ns-link');
  save(d);
  render();
}

function exportMd(id) {
  const d  = state.decisions.find(d => d.id === id);
  const s  = status(d);
  const dt = new Date().toLocaleDateString('de-DE');
  let md = `# Ωmy: ${d.title}\n\n`;
  md += `**Datum:** ${dt}  \n**Status:** ${s.label}  \n**Erstellt von:** ${d.createdBy || '–'}\n\n`;
  md += `## Spannung\n${d.tension}\n\n`;

  d.rounds.forEach(r => {
    md += `## Runde ${r.num} – Vorschlag\n${r.proposal}\n\n`;
    md += `### Abstimmung (Widerstand 0–5)\n\n`;
    if (r.votes.length) {
      md += `| Person | Widerstand | Kommentar |\n|---|---|---|\n`;
      r.votes.forEach(v => { md += `| ${v.voter} | ${v.value} – ${R_LABELS[v.value]} | ${v.comment || '–'} |\n`; });
    } else {
      md += `_Keine Stimmen._\n`;
    }
    md += '\n';
  });

  const finalRound = activeRound(d);
  md += `## Ergebnis\n`;
  if (s.key === 'done') {
    md += `✓ Entscheidung async getroffen. Alle Widerstände ≤ 3.\n\n`;
    md += `**Getroffene Entscheidung:**\n> ${finalRound.proposal.replace(/\n/g, '\n> ')}\n`;
  } else {
    md += `⚠ Synchrones Meeting empfohlen. Mindestens ein Widerstand > 3 nach Runde ${finalRound.num}.\n\n`;
    md += `**Letzter Vorschlag (Grundlage für das Meeting):**\n> ${finalRound.proposal.replace(/\n/g, '\n> ')}\n`;
  }

  if (d.nextSteps) {
    md += `\n## Nächste Schritte\n${d.nextSteps}\n`;
    if (d.responsible) md += `\n**Verantwortlich:** ${d.responsible}\n`;
    if (d.docsLink)    md += `\n[Dokumentation](${d.docsLink})\n`;
  }

  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([md], { type: 'text/markdown' })),
    download: `ohmy-${d.title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}.md`
  });
  a.click();
}

// ── Utils ────────────────────────────────────────────────────────
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleHelp() {
  helpOpen = !helpOpen;
  const hdr = document.getElementById('help-hdr');
  const bdy = document.getElementById('help-bdy');
  if (hdr) hdr.classList.toggle('open', helpOpen);
  if (bdy) bdy.style.display = helpOpen ? 'block' : 'none';
}

function toggleArchive() {
  archiveOpen = !archiveOpen;
  const header = document.getElementById('archive-header');
  const list   = document.getElementById('archive-list');
  if (header) header.classList.toggle('open', archiveOpen);
  if (list)   list.style.display = archiveOpen ? 'block' : 'none';
}

async function refresh() {
  await loadData();
  render();
}

// ── Render ────────────────────────────────────────────────────────
function render() {
  if (state.loading) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:80px 24px;color:var(--gray-text);font-size:14px;">Daten werden geladen…</div>';
    return;
  }
  const views = { home: viewHome, create: viewCreate, detail: viewDetail, vote: viewVote };
  document.getElementById('app').innerHTML = (views[state.view] || viewHome)();
}

loadData().then(() => {
  const id = new URLSearchParams(location.search).get('id');
  if (id && state.decisions.find(d => d.id === id)) go('detail', id);
  else render();
});
