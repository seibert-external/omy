<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsent – Entscheidungen treffen</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #BEE600;
      --dark: #010920;
      --white: #FFFFFF;
      --gray-bg: #F6F6F6;
      --gray-border: #E2E2E2;
      --gray-text: #6B7280;
      --radius: 8px;
      --shadow: 0 2px 10px rgba(1,9,32,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--gray-bg);
      color: var(--dark);
      min-height: 100vh;
    }

    header {
      background: var(--dark);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-dot {
      width: 10px; height: 10px;
      background: var(--lime);
      border-radius: 50%;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.3px;
    }

    main {
      max-width: 740px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .card > p { color: var(--gray-text); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gray-border);
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: var(--dark);
      margin-bottom: 20px;
      transition: border-color 0.2s;
      background: var(--white);
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--lime);
    }
    textarea { resize: vertical; min-height: 100px; }

    .btn-primary {
      background: var(--lime);
      color: var(--dark);
      border: none;
      padding: 11px 22px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.82; }

    .btn-ghost {
      background: transparent;
      color: var(--gray-text);
      border: 1.5px solid var(--gray-border);
      padding: 10px 18px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--dark); color: var(--dark); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--gray-text);
      cursor: pointer;
      margin-bottom: 24px;
      background: none;
      border: none;
      font-family: 'Poppins', sans-serif;
      padding: 0;
    }
    .back-btn:hover { color: var(--dark); }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray-text);
      margin-bottom: 8px;
    }

    .proposal-box {
      background: var(--gray-bg);
      border-left: 3px solid var(--lime);
      padding: 16px 18px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }

    /* SETT-Box */
    .sett-box {
      background: var(--dark);
      color: var(--white);
      border-radius: var(--radius);
      padding: 22px 26px;
      margin-bottom: 28px;
    }
    .sett-box .sett-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 8px;
    }
    .sett-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .sett-box p { font-size: 13px; color: rgba(255,255,255,0.72); line-height: 1.6; }

    /* Resistance scale */
    .resistance-scale {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 12px 0 24px;
    }
    @media (max-width: 500px) {
      .resistance-scale { grid-template-columns: repeat(3, 1fr); }
    }
    .r-btn {
      padding: 14px 6px;
      border: 2px solid var(--gray-border);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-family: 'Poppins', sans-serif;
    }
    .r-btn:hover { border-color: #aaa; }
    .r-btn .r-num { font-size: 22px; font-weight: 700; display: block; }
    .r-btn .r-lab { font-size: 10px; color: var(--gray-text); display: block; margin-top: 3px; line-height: 1.3; }

    .r-btn[data-v="0"] .r-num { color: #16A34A; }
    .r-btn[data-v="1"] .r-num { color: #65A30D; }
    .r-btn[data-v="2"] .r-num { color: #CA8A04; }
    .r-btn[data-v="3"] .r-num { color: #EA580C; }
    .r-btn[data-v="4"] .r-num { color: #DC2626; }
    .r-btn[data-v="5"] .r-num { color: #7F1D1D; }

    .r-btn[data-v="0"].active { border-color: #16A34A; background: #F0FDF4; }
    .r-btn[data-v="1"].active { border-color: #65A30D; background: #F7FEE7; }
    .r-btn[data-v="2"].active { border-color: #CA8A04; background: #FEFCE8; }
    .r-btn[data-v="3"].active { border-color: #EA580C; background: #FFF7ED; }
    .r-btn[data-v="4"].active { border-color: #DC2626; background: #FEF2F2; }
    .r-btn[data-v="5"].active { border-color: #7F1D1D; background: #FEF2F2; }

    /* Decision list */
    .d-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border: 1.5px solid var(--gray-border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.18s;
      background: var(--white);
    }
    .d-item:hover { border-color: var(--dark); }
    .d-item h3 { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .d-item .d-meta { font-size: 12px; color: var(--gray-text); }

    .badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .badge-open    { background: #EEF2FF; color: #4338CA; }
    .badge-running { background: #FFF7ED; color: #C2410C; }
    .badge-done    { background: #F0FDF4; color: #15803D; }
    .badge-meeting { background: #FEF2F2; color: #B91C1C; }

    /* Votes */
    .vote-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: var(--gray-bg);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .v-name { font-size: 14px; font-weight: 500; flex: 1; min-width: 80px; }
    .v-circle {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      color: var(--white);
      flex-shrink: 0;
    }
    .vc-0 { background: #16A34A; }
    .vc-1 { background: #65A30D; }
    .vc-2 { background: #CA8A04; }
    .vc-3 { background: #EA580C; }
    .vc-4 { background: #DC2626; }
    .vc-5 { background: #7F1D1D; }
    .v-comment { font-size: 13px; color: var(--gray-text); flex: 2; }

    /* Result banner */
    .result-banner {
      padding: 20px 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .result-banner h2 { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
    .result-banner p  { font-size: 13px; }
    .rb-done    { background: #F0FDF4; border: 2px solid #16A34A; }
    .rb-done h2 { color: #15803D; }
    .rb-done p  { color: #166534; }
    .rb-meeting { background: #FEF2F2; border: 2px solid #DC2626; }
    .rb-meeting h2 { color: #B91C1C; }
    .rb-meeting p  { color: #991B1B; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 52px 24px;
      color: var(--gray-text);
    }
    .empty .icon { font-size: 36px; margin-bottom: 14px; }
    .empty h3 { font-size: 16px; color: var(--dark); margin-bottom: 6px; }
    .empty p { font-size: 13px; max-width: 320px; margin: 0 auto; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .divider { border: none; border-top: 1px solid var(--gray-border); margin: 20px 0; }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Konsent</h1>
</header>

<main id="app"></main>

<script>
// ── Constants ────────────────────────────────────────────────────
const R_LABELS = ['kein', 'gering', 'leicht erhöht', 'erhöht', 'stark', 'extrem'];

// ── State ────────────────────────────────────────────────────────
const state = {
  view: 'home',
  currentId: null,
  voterName: localStorage.getItem('konsent_voter') || '',
  decisions: JSON.parse(localStorage.getItem('konsent_data') || '[]')
};
let selectedR = null;

function save() {
  localStorage.setItem('konsent_data', JSON.stringify(state.decisions));
}
function go(view, id = null) {
  state.view = view;
  state.currentId = id;
  selectedR = null;
  render();
  window.scrollTo(0, 0);
}
function current() {
  return state.decisions.find(d => d.id === state.currentId);
}
function status(d) {
  if (!d.votes.length) return { key: 'open', label: 'Offen' };
  const allIn = d.participants.every(p => d.votes.find(v => v.voter === p));
  if (!allIn) return { key: 'running', label: 'Läuft' };
  return d.votes.some(v => v.value > 3)
    ? { key: 'meeting', label: 'Meeting nötig' }
    : { key: 'done',    label: 'Entschieden' };
}

// ── Views ────────────────────────────────────────────────────────
function viewHome() {
  const ds = state.decisions;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <div>
        <h2 style="font-size:22px;font-weight:600;">Entscheidungen</h2>
        <p style="font-size:13px;color:var(--gray-text);margin-top:3px;">Konsent-basiert · Async · Safe Enough to Try</p>
      </div>
      <button class="btn-primary" onclick="go('create')">+ Neue Entscheidung</button>
    </div>
    ${ds.length === 0
      ? `<div class="card"><div class="empty">
           <div class="icon">⚡</div>
           <h3>Noch keine Entscheidungen</h3>
           <p>Erstelle deine erste Entscheidung und lade dein Team ein, async abzustimmen.</p>
         </div></div>`
      : ds.map(d => {
          const s = status(d);
          return `<div class="d-item" onclick="go('detail','${d.id}')">
            <div>
              <h3>${esc(d.title)}</h3>
              <div class="d-meta">${d.participants.length} Teilnehmende · ${d.votes.length} Stimmen${d.deadline ? ' · Deadline ' + d.deadline : ''}</div>
            </div>
            <span class="badge badge-${s.key}">${s.label}</span>
          </div>`;
        }).join('')
    }`;
}

function viewCreate() {
  const today = new Date().toISOString().split('T')[0];
  return `
    <button class="back-btn" onclick="go('home')">← Zurück</button>
    <div class="card">
      <h2>Neue Entscheidung</h2>
      <p>Der Vorschlag sollte bereits ausgearbeitet sein – das Tool unterstützt die Abstimmung, nicht die Ausarbeitung.</p>

      <label>Titel der Entscheidung *</label>
      <input type="text" id="f-title" placeholder="z.B. Neues Meetingformat für den OE-Kreis">

      <label>Spannung / Entscheidungsbedarf *</label>
      <textarea id="f-tension" placeholder="Welches Problem oder welchen Bedarf adressiert dieser Vorschlag?"></textarea>

      <label>Vorschlag *</label>
      <textarea id="f-proposal" style="min-height:140px;" placeholder="Der ausgearbeitete Lösungsvorschlag, über den abgestimmt werden soll."></textarea>

      <label>Teilnehmende (kommasepariert) *</label>
      <input type="text" id="f-people" placeholder="z.B. Jan, Caro, Tobias, Miriam">

      <label>Abstimmungs-Deadline (optional)</label>
      <input type="date" id="f-deadline" min="${today}">

      <button class="btn-primary" onclick="createDecision()">Entscheidung erstellen</button>
    </div>`;
}

function viewDetail() {
  const d = current();
  if (!d) return viewHome();
  const s = status(d);
  const pending = d.participants.filter(p => !d.votes.find(v => v.voter === p));

  return `
    <button class="back-btn" onclick="go('home')">← Alle Entscheidungen</button>

    ${s.key === 'done' ? `
      <div class="result-banner rb-done">
        <h2>✓ Entscheidung async getroffen</h2>
        <p>Alle Widerstände ≤ 3 – kein Meeting erforderlich.</p>
      </div>` : ''}
    ${s.key === 'meeting' ? `
      <div class="result-banner rb-meeting">
        <h2>⚠ Synchrones Meeting empfohlen</h2>
        <p>Mindestens ein Widerstand > 3. Nutze diesen Stand als Vorbereitung für das Meeting.</p>
      </div>` : ''}

    <div class="card">
      <div class="section-label">Entscheidung</div>
      <h2 style="margin-bottom:14px;">${esc(d.title)}</h2>

      <div class="section-label">Spannung</div>
      <p style="font-size:14px;line-height:1.7;color:var(--gray-text);margin-bottom:22px;">${esc(d.tension)}</p>

      <div class="section-label">Vorschlag</div>
      <div class="proposal-box">${esc(d.proposal)}</div>

      <div class="row">
        <button class="btn-primary" onclick="go('vote','${d.id}')">Als Teilnehmer*in abstimmen</button>
        ${(s.key === 'done' || s.key === 'meeting') ? `<button class="btn-ghost" onclick="exportMd('${d.id}')">Markdown exportieren</button>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="section-label">Stimmen (${d.votes.length} / ${d.participants.length})</div>
      ${d.votes.length === 0
        ? `<p style="font-size:13px;color:var(--gray-text);">Noch keine Stimmen abgegeben.</p>`
        : d.votes.map(v => `
            <div class="vote-row">
              <span class="v-name">${esc(v.voter)}</span>
              <div class="v-circle vc-${v.value}" title="${R_LABELS[v.value]}">${v.value}</div>
              <span class="v-comment">${esc(v.comment || '')}</span>
            </div>`).join('')
      }
      ${pending.length ? `<p style="font-size:12px;color:var(--gray-text);margin-top:12px;">Ausstehend: ${pending.map(esc).join(', ')}</p>` : ''}
    </div>`;
}

function viewVote() {
  const d = current();
  if (!d) return viewHome();
  return `
    <button class="back-btn" onclick="go('detail','${d.id}')">← Zurück zur Entscheidung</button>

    <div class="sett-box">
      <div class="sett-tag">Safe Enough to Try?</div>
      <h3>Es geht nicht um die perfekte Lösung.</h3>
      <p>Dein Widerstand zeigt, ob dieser Vorschlag sicher genug ist, um ihn auszuprobieren – als nächsten, überprüfbaren Schritt. 0–2: kein nennenswerter Widerstand. 3: erhöht, aber noch vertretbar. 4–5: schwerwiegender Einwand – löst ein synchrones Meeting aus.</p>
    </div>

    <div class="card">
      <div class="section-label">Vorschlag</div>
      <div class="proposal-box">${esc(d.proposal)}</div>

      <hr class="divider">

      <label>Dein Name</label>
      <input type="text" id="v-name" placeholder="Dein Name" value="${esc(state.voterName)}">

      <label>Wie groß ist dein Widerstand gegen diesen Vorschlag?</label>
      <div class="resistance-scale">
        ${[0,1,2,3,4,5].map(i => `
          <button class="r-btn" data-v="${i}" onclick="pickR(${i})">
            <span class="r-num">${i}</span>
            <span class="r-lab">${R_LABELS[i]}</span>
          </button>`).join('')}
      </div>

      <label>Ergänzung oder Einwand (optional)</label>
      <textarea id="v-comment" placeholder="Einwand, Ergänzungsvorschlag oder Anmerkung – wird für alle sichtbar."></textarea>

      <button class="btn-primary" onclick="submitVote('${d.id}')">Abstimmen</button>
    </div>`;
}

// ── Actions ──────────────────────────────────────────────────────
function createDecision() {
  const title    = val('f-title');
  const tension  = val('f-tension');
  const proposal = val('f-proposal');
  const people   = val('f-people');
  const deadline = val('f-deadline');

  if (!title || !tension || !proposal || !people) {
    alert('Bitte alle Pflichtfelder (*) ausfüllen.');
    return;
  }
  const participants = people.split(',').map(s => s.trim()).filter(Boolean);
  const d = {
    id: Date.now().toString(),
    title, tension, proposal, participants, deadline,
    votes: [],
    createdAt: new Date().toISOString()
  };
  state.decisions.unshift(d);
  save();
  go('detail', d.id);
}

function pickR(v) {
  selectedR = v;
  document.querySelectorAll('.r-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.v) === v);
  });
}

function submitVote(id) {
  const name    = val('v-name');
  const comment = val('v-comment');
  if (!name)            { alert('Bitte deinen Namen eingeben.'); return; }
  if (selectedR === null) { alert('Bitte einen Widerstandswert wählen.'); return; }

  state.voterName = name;
  localStorage.setItem('konsent_voter', name);

  const d = state.decisions.find(d => d.id === id);
  d.votes = d.votes.filter(v => v.voter !== name);
  d.votes.push({ voter: name, value: selectedR, comment });
  save();
  go('detail', id);
}

function exportMd(id) {
  const d  = state.decisions.find(d => d.id === id);
  const s  = status(d);
  const dt = new Date().toLocaleDateString('de-DE');
  let md = `# Konsent-Entscheidung: ${d.title}\n\n`;
  md += `**Datum:** ${dt}  \n**Status:** ${s.label}\n\n`;
  md += `## Spannung\n${d.tension}\n\n`;
  md += `## Vorschlag\n${d.proposal}\n\n`;
  md += `## Abstimmung (Widerstand 0–5)\n\n`;
  md += `| Person | Widerstand | Kommentar |\n|---|---|---|\n`;
  d.votes.forEach(v => {
    md += `| ${v.voter} | ${v.value} – ${R_LABELS[v.value]} | ${v.comment || '–'} |\n`;
  });
  md += `\n## Ergebnis\n`;
  md += s.key === 'done'
    ? `✓ Entscheidung async getroffen. Alle Widerstände ≤ 3.\n`
    : `⚠ Synchrones Meeting empfohlen. Mindestens ein Widerstand > 3.\n`;

  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([md], { type: 'text/markdown' })),
    download: `konsent-${d.title.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}.md`
  });
  a.click();
}

// ── Utils ────────────────────────────────────────────────────────
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Render ────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const views = { home: viewHome, create: viewCreate, detail: viewDetail, vote: viewVote };
  app.innerHTML = (views[state.view] || viewHome)();
}

render();
</script>
</body>
</html>
